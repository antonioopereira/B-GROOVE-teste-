<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B Groove - Contact</title>
    <link rel="icon" type="image/svg+xml" href="Asset 1.svg">
    <link rel="stylesheet" href="stylecontact.css">
</head>
<body>

    <!-- Overlay de Navegação Fullscreen -->
    <div class="nav-overlay" id="nav-overlay">

        <!-- Botão X para fechar -->
        <button class="nav-close" id="nav-close" aria-label="Fechar menu">
            <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
                <line x1="6" y1="6" x2="18" y2="18"></line>
                <line x1="18" y1="6" x2="6" y2="18"></line>
            </svg>
        </button>

        <nav class="nav-content">
            <a href="directors.html">Directors</a>
            <a href="photographers.html">Photographers</a>
            <a href="international.html">International</a>
            <a href="spritz.html">Spritz</a>
            <a href="us.html">Us.</a>
            <a href="contact.html">Contact</a>
        </nav>
    </div>

    <!-- Logo Central (Botão de Navegação) -->
    <div class="logo-container" id="logo-toggle">
        <img src="Asset 1.svg" alt="B Groove Logo">
    </div>

    <!-- Conteúdo Principal -->
    <main class="contact-content">

        <div class="contact-left">
            <h1 class="contact-title">Get in<br>touch.</h1>
            <p class="contact-subtitle">
                Para colaborações, projetos ou apenas um olá — estamos sempre disponíveis.
            </p>
        </div>

        <div class="contact-right">

            <div class="contact-block">
                <span class="contact-label">Email</span>
                <a href="mailto:info@bgroove.co" class="contact-link">info@bgroove.co</a>
            </div>

            <div class="contact-block">
                <span class="contact-label">Instagram</span>
                <a href="https://www.instagram.com/bgroove.co/" target="_blank" rel="noopener" class="contact-link">@bgroove</a>
            </div>

            <div class="contact-block">
                <span class="contact-label">Localização</span>
                <span class="contact-link">Lisboa, Portugal</span>
            </div>

        </div>

    </main>

    <!-- Footer -->
    <footer class="site-footer">
        <p class="footer-desc">
            B Groove - Creative Production House. 2026.
        </p>

        <a href="https://www.instagram.com/bgroove.co/" target="_blank" rel="noopener" class="footer-instagram">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <rect x="2" y="2" width="20" height="20" rx="5" ry="5"></rect>
                <path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"></path>
                <line x1="17.5" y1="6.5" x2="17.51" y2="6.5"></line>
            </svg>
            <span>@bgroove</span>
        </a>
    </footer>

    <!-- Scripts -->
    <script src="scriptcontact.js"></script>

</body>
</html>
